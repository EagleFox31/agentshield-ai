[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-ai"
version = "0.1.0a0"
description = "Policy-first security primitives for AI agent tool authorization"
requires-python = ">=3.11"
# Pywrangler resolves Pyodide dependencies from the required project set.
# Worker production runtime contains no PyJWT or cryptography compiled wheel.
# Native Cloudflare Web Crypto handles ES256 verification (fail closed outside Worker).
dependencies = ["fastapi==0.162.0", "starlette==1.3.1"]
authors = [{name = "Jennifer Lawrynn"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security"
]

[tool.setuptools.packages.find]
where = ["src"]

# The pure PolicyEngine uses only the standard library; FastAPI is a package dependency
# solely so Pywrangler installs it into the Worker/Pyodide runtime.
# Only the local Worker compatibility job installs these development tools.
[dependency-groups]
# For generating synthetic signing fixtures on *host CPython* before pywrangler
# boots. pywrangler reads [project.dependencies] for the Pyodide Worker image.
worker = ["workers-py==1.17.7", "workers-runtime-sdk==1.9.1",
          "PyJWT==2.15.1", "cryptography==50.0.2"]
# Host-only independent PyJWT security oracle for parity tests.
test = ["PyJWT==2.15.1", "cryptography==50.0.2"]

