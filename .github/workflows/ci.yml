name: AgentShield Python CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q src tests
      - name: Run security decisions regression tests (no runtime dependencies)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - name: Resolve lock with uv (bootstrap prints generated lock)
        shell: bash
        run: |
          set -euo pipefail
          uv lock --python 3.13
          if ! git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo LOCK_GENERATION_BEGIN_V1
            cat uv.lock
            echo LOCK_GENERATION_END_V1
            echo "Lockfile not committed. Bootstrap artifact is printed for review."
            exit 1
          fi
          uv lock --check

  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies from a clean runner
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Audit resolved Python dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          pip-audit . --format cyclonedx-json --output python-runtime-sbom.cdx.json
      - name: Preserve audited dependency evidence, including failed scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runtime-sbom
          path: python-runtime-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned community linter
        run: python -m pip install --disable-pip-version-check 'ruff==0.17.2'
      - name: Reject undefined names and fatal syntax errors in existing Python sources
        run: ruff check src tests scripts --select E9,F63,F7,F82
