name: AgentShield Python CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q src tests
      - name: Run security decisions regression tests (no runtime dependencies)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies from a clean runner
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Audit resolved Python dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          pip-audit .
