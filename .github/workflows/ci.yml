name: AgentShield Python CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
      - 'uv.lock'
      - 'docs/REPRODUCIBLE_DEVELOPMENT.md'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q src tests
      - name: Run security decisions regression tests (no runtime dependencies)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.13"
      - name: Reject stale or missing committed uv.lock
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch uv.lock >/dev/null
          uv lock --check --python 3.13
          git diff --exit-code -- uv.lock

  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies from a clean runner
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Audit resolved Python dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          pip-audit . --format cyclonedx-json --output python-runtime-sbom.cdx.json
      - name: Preserve audited dependency evidence, including failed scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runtime-sbom
          path: python-runtime-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

  dependency-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # checkout v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build clean production dependency environment
        run: |
          set -euo pipefail
          python -m venv .runtime-license-env
          .runtime-license-env/bin/python -m pip install --disable-pip-version-check -e .
          .runtime-license-env/bin/python -m pip check
      - name: Install established license auditor separately
        run: |
          python -m venv .license-scanner-env
          .license-scanner-env/bin/python -m pip install --disable-pip-version-check 'pip-licenses==5.5.5'
      - name: Generate third-party runtime license manifest and block known incompatible licenses
        shell: bash
        run: |
          set -euo pipefail
          scanner=.license-scanner-env/bin/pip-licenses
          interpreter="$PWD/.runtime-license-env/bin/python"
          "$scanner" --python "$interpreter" --from=all --format=json --with-urls \
            --ignore-packages agentshield-ai \
            --output-file dependency-licenses.json
          "$scanner" --python "$interpreter" --from=all \
            --ignore-packages agentshield-ai \
            --fail-on='GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GNU General Public License v3 (GPLv3);GNU Affero General Public License v3'
          # Prove the scanner fails on a known installed permissive library
          # when intentionally marked prohibited. Synthetic policy test only.
          if "$scanner" --python "$interpreter" --from=all --packages fastapi --fail-on='MIT;MIT License'; then
            echo "License gate failed to reject a deliberately forbidden installed license" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('dependency-licenses.json').read_text())
          assert len(rows) >= 5, 'License inventory unexpectedly empty'
          assert any(r['Name'].casefold() == 'fastapi' for r in rows), 'Required FastAPI missing'
          print(f"Inventory: {len(rows)} third-party runtime packages")
          PY
      - name: Preserve dependency license manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runtime-licenses
          path: dependency-licenses.json
          if-no-files-found: warn
          retention-days: 14

  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          python-version: '3.13'
      - name: Reject undefined names and fatal syntax errors
        run: uv run --locked --group quality ruff check src tests scripts --select E9,F63,F7,F82
      - name: Enforce formatting of the core security policy engine
        run: uv run --locked --group quality ruff format --check --diff src/agentshield/policy.py
      - name: Strict type-check the core security policy engine
        run: uv run --locked --group quality mypy --strict src/agentshield/policy.py
      - name: Prove static safety and type gates actually reject invalid code
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf 'unresolved_symbol()\n' > "$tmp/unsafe.py"
          if uv run --locked --group quality ruff check "$tmp/unsafe.py" --select F821; then
            echo "Ruff must reject an undefined symbol" >&2
            exit 1
          fi
          printf 'value: int = "text"\n' > "$tmp/bad_type.py"
          if uv run --locked --group quality mypy --strict "$tmp/bad_type.py"; then
            echo "Mypy must reject an incompatible annotation" >&2
            exit 1
          fi
