name: AgentShield FastAPI/D1 Local Compatibility

on:
  pull_request:
    paths:
      - 'src/agentshield/gateway.py'
      - 'src/agentshield/audit*.py'
      - 'migrations/**'
      - 'src/agentshield/identity.py'
      - 'src/agentshield/demo_invoice.py'
      - 'src/agentshield/detection.py'
      - 'src/agentshield/workers_ai_adapter.py'
      - 'src/agentshield/ai_budget.py'
      - 'scripts/evaluate_detection.py'
      - 'tests/fixtures/detection_v1.json'
      - 'src/agentshield/merkle.py'
      - 'scripts/demo_merkle_proofs.py'
      - 'scripts/verify_merkle.py'
      - 'contracts/AuditRootRegistry.sol'
      - 'scripts/demo_invoice_attack.py'
      - 'src/agentshield/approval*.py'
      - 'src/agentshield/approvals.py'
      - 'scripts/approval_cli.py'
      - 'scripts/make_local_identity_fixture.py'
      - 'src/worker.py'
      - 'tests/gateway/**'
      - 'wrangler.jsonc'
      - 'pyproject.toml'
      - '.github/workflows/gateway-smoke-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/agentshield/gateway.py'
      - 'src/agentshield/audit*.py'
      - 'migrations/**'
      - 'src/agentshield/identity.py'
      - 'src/agentshield/demo_invoice.py'
      - 'src/agentshield/detection.py'
      - 'src/agentshield/workers_ai_adapter.py'
      - 'src/agentshield/ai_budget.py'
      - 'scripts/evaluate_detection.py'
      - 'tests/fixtures/detection_v1.json'
      - 'src/agentshield/merkle.py'
      - 'scripts/demo_merkle_proofs.py'
      - 'scripts/verify_merkle.py'
      - 'contracts/AuditRootRegistry.sol'
      - 'scripts/demo_invoice_attack.py'
      - 'src/agentshield/approval*.py'
      - 'src/agentshield/approvals.py'
      - 'scripts/approval_cli.py'
      - 'scripts/make_local_identity_fixture.py'
      - 'src/worker.py'
      - 'tests/gateway/**'
      - 'wrangler.jsonc'
      - 'pyproject.toml'
      - '.github/workflows/gateway-smoke-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP smoke dependencies
        run: python -m pip install -e . 'httpx>=0.28,<0.29' 'PyJWT==2.15.1' 'cryptography==50.0.2'
      - name: Run independent HTTP + fake-D1 regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/gateway -v
      - name: Assert the no-network invoice injection demo
        env:
          PYTHONPATH: src
        run: python scripts/demo_invoice_attack.py --assert-secure
      - name: Assert Merkle inclusion and history-tampering regressions offline
        env:
          PYTHONPATH: src
        run: python scripts/demo_merkle_proofs.py --assert-secure
      - name: Evaluate synthetic detection confusion matrix without an LLM
        env:
          PYTHONPATH: src
        run: python scripts/evaluate_detection.py --assert-contract

  python-worker-d1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Create ephemeral ES256 identity fixtures (no hosted issuer)
        run: uv run --group worker python scripts/make_local_identity_fixture.py
      - name: Apply portable audit schema to LOCAL D1 only
        run: |
          npx --yes wrangler d1 execute agentshield-local-only --local --file=migrations/0001_audit_core.sql
          npx --yes wrangler d1 execute agentshield-local-only --local --file=migrations/0002_approval_review.sql
          npx --yes wrangler d1 execute agentshield-local-only --local --file=migrations/0003_ai_triage_budget.sql
          # Manually provision a tiny quota for the synthetic LOCAL tenant.
          # Never configure or invoke a real AI binding in the workflow.
          npx --yes wrangler d1 execute agentshield-local-only --local --command="INSERT INTO ai_triage_daily_budget (tenant_id,utc_day,max_requests,max_reserved_tokens) VALUES ('ci_local','2026-10-26',2,4288)"
      - name: Start local Pywrangler and probe FastAPI / D1 binding
        shell: bash
        run: |
          set -euo pipefail
          uv run --group worker pywrangler dev > /tmp/agentshield-pywrangler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/agentshield-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Pywrangler terminated before readiness.'
              tail -80 /tmp/agentshield-pywrangler.log
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Pywrangler readiness timeout.'
            tail -80 /tmp/agentshield-pywrangler.log
            exit 1
          fi
          python -c 'import json; d=json.load(open("/tmp/agentshield-health.json")); assert d["enforcement_ready"] is False'
          curl --fail --silent -H 'content-type: application/json' -d '{"tool":"suppliers","operation":"update_bank_account","resource":"supplier/482"}' http://127.0.0.1:8787/_local/policy > /tmp/agentshield-policy.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-policy.json")); assert d["effect"]=="deny" and d["executed"] is False'
          curl --fail --silent -X POST http://127.0.0.1:8787/_local/d1-smoke > /tmp/agentshield-d1.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-d1.json")); assert d["d1_local_probe"]=="ok" and d["persistent_audit_ready"] is False'
          # Test actual JWT cryptographic verification inside Python Workers/Pyodide.
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/v1/identity > /tmp/agentshield-auth.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-auth.json")); assert d["authenticated"] is True and d["agent_id"]=="local-demo-agent" and d["tenant_id"]=="ci_local" and not d["enforcement_ready"] and not d["executed"]'
          for fixture in bad_signature wrong_audience expired; do
            status=$(curl --silent -o /tmp/agentshield-auth-rejected.json -w '%{http_code}' \
              -H "Authorization: Bearer $(cat ".local-jwt/$fixture.txt")" \
              http://127.0.0.1:8787/v1/identity)
            if [[ "$status" != "401" ]]; then
              echo "Invalid ES256 token was not rejected: $fixture (HTTP $status)"
              exit 1
            fi
          done
          curl --fail --silent --show-error -X POST http://127.0.0.1:8787/_local/audit-contract > /tmp/agentshield-audit.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-audit.json")); assert d["d1_audit_contract"]=="ok" and d["tenant_isolated"] and d["event_idempotent"] and d["nonce_once"] and not d["executed"]'
          # RAIDER P0 isolated WebCrypto ES256 signature-only compatibility probe.
          # Existing PyJWT auth still gates operator access. This returns NO
          # caller identity, roles or authorization decisions.
          operator_probe_token=$(cat .local-jwt/operator_valid.txt)
          for fixture in valid bad_signature wrong_audience; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $operator_probe_token" \
              -H "X-Probe-Token: $(cat ".local-jwt/$fixture.txt")" \
              http://127.0.0.1:8787/_local/demo/webcrypto-es256-probe \
              > "/tmp/webcrypto-probe-$fixture.json"
          done
          python -c 'import json; d=json.load(open("/tmp/webcrypto-probe-valid.json")); assert d["signature_valid"] is True and d["claims_validated"] is False and not d["authorization_ready"] and not d["used_for_authentication"] and not d["real_tool_called"] and d["local_only"]'
          python -c 'import json; d=json.load(open("/tmp/webcrypto-probe-bad_signature.json")); assert d["signature_valid"] is False and d["claims_validated"] is False'
          # Wrong audience still has a VALID signature; proves this SPIKE is
          # NOT a JWT authenticator, and the real /v1/identity rejects it.
          python -c 'import json; d=json.load(open("/tmp/webcrypto-probe-wrong_audience.json")); assert d["signature_valid"] is True and d["claims_validated"] is False'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "X-Probe-Token: $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/_local/demo/webcrypto-es256-probe)
          test "$status" = 401
          echo 'Local Pyodide WebCrypto ES256 signature parity checked with signed, forged and wrong-audience fixtures; NO auth replacement.'
          # Candidate verifies the ENTIRE JWT contract only after native
          # Web Crypto signature verification; never used for authorization.
          for fixture in valid rotated_valid bad_signature unknown_kid wrong_audience wrong_issuer expired \
                         future_claims invalid_scope invalid_tenant audience_list \
                         missing_jti; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $operator_probe_token" \
              -H "X-Probe-Token: $(cat ".local-jwt/$fixture.txt")" \
              http://127.0.0.1:8787/_local/demo/webcrypto-jwt-candidate \
              > "/tmp/webcrypto-jwt-$fixture.json"
          done
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_probe_token" \
            -H "X-Probe-Token: $operator_probe_token" \
            http://127.0.0.1:8787/_local/demo/webcrypto-jwt-candidate \
            > /tmp/webcrypto-jwt-operator-key.json
          python - <<'PY_CANDIDATE'
          import json
          from pathlib import Path
          valid = json.loads(Path("/tmp/webcrypto-jwt-valid.json").read_text())
          assert valid["candidate_valid"] is True, valid
          assert valid["same_tenant_as_operator"] is True, valid
          assert valid["validated_scope_count"] == 1, valid
          assert valid["used_for_authentication"] is False
          assert valid["enforcement_ready"] is False
          assert valid["real_tool_called"] is False
          rotated = json.loads(Path("/tmp/webcrypto-jwt-rotated_valid.json").read_text())
          assert rotated["candidate_valid"] is True and rotated["validated_scope_count"] == 1
          for name in ("bad_signature", "unknown_kid", "wrong_audience", "wrong_issuer",
                       "expired", "future_claims", "invalid_scope", "invalid_tenant",
                       "audience_list", "missing_jti", "operator-key"):
              candidate = json.loads(Path(f"/tmp/webcrypto-jwt-{name}.json").read_text())
              assert candidate["candidate_valid"] is False, (name, candidate)
              assert candidate["validated_scope_count"] == 0, (name, candidate)
              assert candidate["enforcement_ready"] is False
          PY_CANDIDATE
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "X-Probe-Token: $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/_local/demo/webcrypto-jwt-candidate)
          test "$status" = 401
          echo 'Candidate full JWT claims/signature validated under local Pyodide; NOT used as gateway auth.'

          echo 'Local FastAPI, D1 redacted audit, one-time nonce and ES256 JWT passed in Python Workers.'
          # Separate operator and agent JWT trust roots, with a local-only mock.
          agent_token=$(cat .local-jwt/approval_agent.txt)
          operator_token=$(cat .local-jwt/operator_valid.txt)
          readonly_token=$(cat .local-jwt/operator_readonly.txt)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $agent_token" -H "Content-Type: application/json" \
            -d '{"fixture":"scenario-A"}' \
            http://127.0.0.1:8787/_local/demo/approval-requests > /tmp/approval-created.json
          approval_id=$(python -c 'import json; d=json.load(open("/tmp/approval-created.json"));assert d["state"]=="pending"; print(d["approval_id"])')
          # Agent token cannot impersonate human operator.
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" http://127.0.0.1:8787/_local/approvals)
          test "$status" = 401
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/approvals > /tmp/operator-list.json
          python -c 'import json; d=json.load(open("/tmp/operator-list.json"));assert d["approvals"][0]["state"]=="pending"'
          # Same API, separate CLI implementation; token only via environment.
          AGENTSHIELD_OPERATOR_TOKEN="$operator_token" python scripts/approval_cli.py list > /tmp/approval-cli-list.json
          python -c 'import json; d=json.load(open("/tmp/approval-cli-list.json"));assert len(d["approvals"])>=1'

          # Read-only operator is barred from approving.
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $readonly_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/approve")
          test "$status" = 403
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/approve" > /tmp/approval-approved.json
          python -c 'import json;d=json.load(open("/tmp/approval-approved.json"));assert d["state"]=="approved" and not d["executed"]'
          # Changed argument digest cannot use a grant.
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-B"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume")
          test "$status" = 409
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume" > /tmp/approval-consumed.json
          python -c 'import json;d=json.load(open("/tmp/approval-consumed.json"));assert d["simulated_execution"] and d["real_tool_called"] is False'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume")
          test "$status" = 409
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/audit" > /tmp/approval-audit.json
          python -c 'import json;d=json.load(open("/tmp/approval-audit.json"));assert len(d["events"])>=3 and all(len(e["event_sha256"])==64 for e in d["events"])'
          # A different approval with the same action digest must not inherit
          # the first request's private audit history.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            http://127.0.0.1:8787/_local/demo/approval-requests > /tmp/approval-second.json
          second_id=$(python -c 'import json;print(json.load(open("/tmp/approval-second.json"))["approval_id"])')
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$second_id/audit" > /tmp/approval-second-audit.json
          python -c 'import json;d=json.load(open("/tmp/approval-second-audit.json"));assert len(d["events"])==1'
          # Confirm human rejection cannot become a mock execution.
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$second_id/reject" > /tmp/approval-rejected.json
          python -c 'import json;d=json.load(open("/tmp/approval-rejected.json"));assert d["state"]=="rejected"'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$second_id/consume")
          test "$status" = 409

          curl --fail --silent http://127.0.0.1:8787/_local/dashboard > /tmp/approval-dashboard.html
          grep -q 'Human review' /tmp/approval-dashboard.html
          echo 'Human approval workflow (operator JWT, D1 atomic review, evidence, one-time mock) verified locally.'
          # A malicious invoice is data, not an authority to expand signed
          # scopes. Both allowed read and denied write must be durably audited.
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/_local/demo/invoice-injection > /tmp/invoice-injection.json
          python -c 'import json;d=json.load(open("/tmp/invoice-injection.json"));assert d["read_effect"]=="allow" and d["denied_effect"]=="deny" and d["denied_reasons"]==["REQUIRED_SCOPE_MISSING"] and d["invoice_reads"]==1 and d["supplier_writes"]==0 and not d["real_tool_called"] and d["jwt_verified_by_gateway"] and len(d["audit_event_ids"])==2'
          # A broader agent scope would make the negative demo meaningless:
          # it MUST fail, not silently run a high-impact mock tool.
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $(cat .local-jwt/approval_agent.txt)" \
            http://127.0.0.1:8787/_local/demo/invoice-injection)
          test "$status" = 403
          # Only the trusted human operator can inspect the same tenant's
          # sanitized decision records; never disclose invoice/PII.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/invoice-evidence > /tmp/invoice-evidence.json
          python -c 'import json;d=json.load(open("/tmp/invoice-evidence.json"));assert d["scenario"]=="hostile_supplier_invoice_v1" and len(d["events"])==2 and set(x["effect"] for x in d["events"])=={"allow","deny"} and not d["source_document_included"]'
          echo 'Invoice injection blocked: zero supplier writes, signed identity, two durable redacted D1 events.'
          # Merkle roots are computed from actual D1 event rows, not fake
          # in-memory objects. The human operator is a separate signed actor.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/merkle-batch > /tmp/merkle-d1.json
          python -c 'import json;d=json.load(open("/tmp/merkle-d1.json"));assert d["manifest"]["count"]==2 and d["verification_status"]=="consistent_unanchored" and not d["onchain_verified"] and len(d["inclusion_paths"])==2'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/_local/demo/merkle-batch)
          test "$status" = 401
          echo 'Actual D1 audit entries batched into an UNANCHORED Merkle snapshot, operator-only.'
          # The signed human operator can inspect rule-only advisory telemetry.
          # A model provider is not configured, so no network inference, keys
          # or prompt content can leave this local Worker.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/threat-triage > /tmp/threat-triage.json
          python -c 'import json;d=json.load(open("/tmp/threat-triage.json"));codes={s["code"] for s in d["signals"]};assert d["policy_effect"]=="deny" and "INSTRUCTION_OVERRIDE" in codes and "PRIVILEGE_REQUEST" in codes and d["model_status"]=="not_configured" and not d["real_tool_called"] and not d["authorization_from_ai"] and not d["source_document_included"]'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/_local/demo/threat-triage)
          test "$status" = 401
          echo 'Hybrid triage local preview has advisory-only signals, no model or authorization bypass.'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/ai-adapter-contract > /tmp/worker-ai-sandbox.json
          python -c 'import json; d=json.load(open("/tmp/worker-ai-sandbox.json")); assert d["simulated_provider"] and not d["remote_inference"] and not d["actual_ai_binding_used"] and d["model_status"]=="available" and d["model_advisory"]["risk_code"]=="POSSIBLE_TOOL_HIJACK" and d["policy_effect"]=="deny" and not d["real_tool_called"]'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" \
            http://127.0.0.1:8787/_local/demo/ai-adapter-contract)
          test "$status" = 401
          # Two maximum-cost reservations allowed; third fake inference cannot
          # exceed per-tenant/day local quota and reports triage_unavailable.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/ai-adapter-contract > /tmp/worker-ai-sandbox-second.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/demo/ai-adapter-contract > /tmp/worker-ai-sandbox-third.json
          python -c 'import json; d=json.load(open("/tmp/worker-ai-sandbox-third.json")); assert d["model_status"]=="triage_unavailable" and d["policy_effect"]=="deny" and not d["remote_inference"]'
          echo 'Workers AI candidate validated ONLY with fake binding and atomic local D1 quota; no live inference.'
      - name: Print diagnostic on failure
        if: failure()
        run: |
          if [ -f /tmp/agentshield-pywrangler.log ]; then
            sed -E 's/([Tt]oken|[Ss]ecret|[Pp]assword)=\S+/\1=[REDACTED]/g' /tmp/agentshield-pywrangler.log | tail -100
          fi
