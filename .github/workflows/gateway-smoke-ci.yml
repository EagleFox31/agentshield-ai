name: AgentShield FastAPI/D1 Local Compatibility

on:
  pull_request:
    paths:
      - 'src/agentshield/gateway.py'
      - 'src/agentshield/audit*.py'
      - 'migrations/**'
      - 'src/agentshield/identity.py'
      - 'src/agentshield/approval*.py'
      - 'src/agentshield/approvals.py'
      - 'scripts/approval_cli.py'
      - 'scripts/make_local_identity_fixture.py'
      - 'src/worker.py'
      - 'tests/gateway/**'
      - 'wrangler.jsonc'
      - 'pyproject.toml'
      - '.github/workflows/gateway-smoke-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/agentshield/gateway.py'
      - 'src/agentshield/audit*.py'
      - 'migrations/**'
      - 'src/agentshield/identity.py'
      - 'src/agentshield/approval*.py'
      - 'src/agentshield/approvals.py'
      - 'scripts/approval_cli.py'
      - 'scripts/make_local_identity_fixture.py'
      - 'src/worker.py'
      - 'tests/gateway/**'
      - 'wrangler.jsonc'
      - 'pyproject.toml'
      - '.github/workflows/gateway-smoke-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP smoke dependencies
        run: python -m pip install -e . 'httpx>=0.28,<0.29'
      - name: Run independent HTTP + fake-D1 regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/gateway -v

  python-worker-d1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Create ephemeral ES256 identity fixtures (no hosted issuer)
        run: uv run --group worker python scripts/make_local_identity_fixture.py
      - name: Apply portable audit schema to LOCAL D1 only
        run: |
          npx --yes wrangler d1 execute agentshield-local-only --local --file=migrations/0001_audit_core.sql
          npx --yes wrangler d1 execute agentshield-local-only --local --file=migrations/0002_approval_review.sql
      - name: Start local Pywrangler and probe FastAPI / D1 binding
        shell: bash
        run: |
          set -euo pipefail
          uv run --group worker pywrangler dev > /tmp/agentshield-pywrangler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/agentshield-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Pywrangler terminated before readiness.'
              tail -80 /tmp/agentshield-pywrangler.log
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Pywrangler readiness timeout.'
            tail -80 /tmp/agentshield-pywrangler.log
            exit 1
          fi
          python -c 'import json; d=json.load(open("/tmp/agentshield-health.json")); assert d["enforcement_ready"] is False'
          curl --fail --silent -H 'content-type: application/json' -d '{"tool":"suppliers","operation":"update_bank_account","resource":"supplier/482"}' http://127.0.0.1:8787/_local/policy > /tmp/agentshield-policy.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-policy.json")); assert d["effect"]=="deny" and d["executed"] is False'
          curl --fail --silent -X POST http://127.0.0.1:8787/_local/d1-smoke > /tmp/agentshield-d1.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-d1.json")); assert d["d1_local_probe"]=="ok" and d["persistent_audit_ready"] is False'
          # Test actual JWT cryptographic verification inside Python Workers/Pyodide.
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            http://127.0.0.1:8787/v1/identity > /tmp/agentshield-auth.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-auth.json")); assert d["authenticated"] is True and d["agent_id"]=="local-demo-agent" and d["tenant_id"]=="ci_local" and not d["enforcement_ready"] and not d["executed"]'
          for fixture in bad_signature wrong_audience expired; do
            status=$(curl --silent -o /tmp/agentshield-auth-rejected.json -w '%{http_code}' \
              -H "Authorization: Bearer $(cat ".local-jwt/$fixture.txt")" \
              http://127.0.0.1:8787/v1/identity)
            if [[ "$status" != "401" ]]; then
              echo "Invalid ES256 token was not rejected: $fixture (HTTP $status)"
              exit 1
            fi
          done
          curl --fail --silent --show-error -X POST http://127.0.0.1:8787/_local/audit-contract > /tmp/agentshield-audit.json
          python -c 'import json; d=json.load(open("/tmp/agentshield-audit.json")); assert d["d1_audit_contract"]=="ok" and d["tenant_isolated"] and d["event_idempotent"] and d["nonce_once"] and not d["executed"]'
          echo 'Local FastAPI, D1 redacted audit, one-time nonce and ES256 JWT passed in Python Workers.'
          # Separate operator and agent JWT trust roots, with a local-only mock.
          agent_token=$(cat .local-jwt/approval_agent.txt)
          operator_token=$(cat .local-jwt/operator_valid.txt)
          readonly_token=$(cat .local-jwt/operator_readonly.txt)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $agent_token" -H "Content-Type: application/json" \
            -d '{"fixture":"scenario-A"}' \
            http://127.0.0.1:8787/_local/demo/approval-requests > /tmp/approval-created.json
          approval_id=$(python -c 'import json; d=json.load(open("/tmp/approval-created.json"));assert d["state"]=="pending"; print(d["approval_id"])')
          # Agent token cannot impersonate human operator.
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" http://127.0.0.1:8787/_local/approvals)
          test "$status" = 401
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            http://127.0.0.1:8787/_local/approvals > /tmp/operator-list.json
          python -c 'import json; d=json.load(open("/tmp/operator-list.json"));assert d["approvals"][0]["state"]=="pending"'
          # Read-only operator is barred from approving.
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $readonly_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/approve")
          test "$status" = 403
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/approve" > /tmp/approval-approved.json
          python -c 'import json;d=json.load(open("/tmp/approval-approved.json"));assert d["state"]=="approved" and not d["executed"]'
          # Changed argument digest cannot use a grant.
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-B"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume")
          test "$status" = 409
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume" > /tmp/approval-consumed.json
          python -c 'import json;d=json.load(open("/tmp/approval-consumed.json"));assert d["simulated_execution"] and d["real_tool_called"] is False'
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' \
            -d '{"fixture":"scenario-A"}' \
            "http://127.0.0.1:8787/_local/demo/approvals/$approval_id/consume")
          test "$status" = 409
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/approvals/$approval_id/audit" > /tmp/approval-audit.json
          python -c 'import json;d=json.load(open("/tmp/approval-audit.json"));assert len(d["events"])>=3 and all(len(e["event_sha256"])==64 for e in d["events"])'
          curl --fail --silent http://127.0.0.1:8787/_local/dashboard > /tmp/approval-dashboard.html
          grep -q 'Human review' /tmp/approval-dashboard.html
          echo 'Human approval workflow (operator JWT, D1 atomic review, evidence, one-time mock) verified locally.'
      - name: Print diagnostic on failure
        if: failure()
        run: |
          if [ -f /tmp/agentshield-pywrangler.log ]; then
            sed -E 's/([Tt]oken|[Ss]ecret|[Pp]assword)=\S+/\1=[REDACTED]/g' /tmp/agentshield-pywrangler.log | tail -100
          fi
