            -H 'Content-Type: application/json' \
            -d '{"tool":"invoices","operation":"read","resource":"invoice/42","request_id":"decision-ci-public-001"}' \
            http://127.0.0.1:8787/v1/idempotent-decisions)
          test "$status" = 404
          echo 'Local Pyodide/D1 idempotent receipts: exact retry, one audit, scope/action collision refusal verified.'
          # Existing ES256 agent JWT queues a fake invoice command + immutable
          # audit. A reply lost during commit must not create another command.
          for output in first retry; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
              -H 'Content-Type: application/json' \
              -d '{"request_id":"outbox-retry-request-00001"}' \
              http://127.0.0.1:8787/_local/commands/queue > "/tmp/outbox-$output.json"
          done
          command_id=$(python - <<'PY_OUTBOX'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/outbox-first.json").read_text())
          b=json.loads(Path("/tmp/outbox-retry.json").read_text())
          assert a["state"]==b["state"]=="queued"
          assert a["command_id"]==b["command_id"]
          assert a["decision_event_id"]==b["decision_event_id"]
          assert a["queue_audit_event_id"]==b["queue_audit_event_id"]
          assert not a["replayed"] and b["replayed"]
          assert a["audit_recorded"] and b["audit_recorded"]
          assert a["policy_version"]=="ci-local-policy-v2"
          assert not a["real_tool_called"] and not b["executed"]
          print(a["command_id"])
          PY_OUTBOX
          )
          status=$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(cat .local-jwt/approval_agent.txt)" \
            -H 'Content-Type: application/json' \
            -d '{"request_id":"outbox-retry-request-00001"}' \
            http://127.0.0.1:8787/_local/commands/queue)
          test "$status" = 409
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            "http://127.0.0.1:8787/_local/commands/$command_id/claim")
          test "$status" = 401
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $readonly_token" \
            "http://127.0.0.1:8787/_local/commands/$command_id/claim")
          test "$status" = 403
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/commands/$command_id/claim" > /tmp/outbox-claimed.json
          python -c 'import json;d=json.load(open("/tmp/outbox-claimed.json"));assert d["state"]=="claimed" and d["claim_audit_event_id"] and not d["real_tool_called"]'
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/commands/$command_id/claim")
          test "$status" = 409
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/commands/$command_id/mark-uncertain" > /tmp/outbox-uncertain.json
          python -c 'import json;d=json.load(open("/tmp/outbox-uncertain.json"));assert d["state"]=="uncertain" and d["reconcile_audit_event_id"] and not d["executed"]'
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/_local/commands/$command_id/claim")
          test "$status" = 409
          status=$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $operator_token" \
            "http://127.0.0.1:8787/v1/commands/$command_id/claim")
          test "$status" = 404
          echo 'Local D1 outbox signed queue, retry, operator one-use claim, uncertain state and zero external I/O verified.'

          # The previous decision may have been in another fixed minute.
          # Start just after a fresh minute boundary for a deterministic
          # 16 NEW requests + 17th denied test, without test-only clocks.
          # JWT fixtures last 240 seconds; no remote or public call is made.
          sleep $((61 - $(date -u +%s) % 60))
          # Repeated key must still return the initial immutable receipt
          # without allocating any new slot.
          for i in $(seq 1 16); do
            key=$(printf 'ci-quota-decision-%06d' "$i")
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
              -H 'Content-Type: application/json' \
              -d "{\"tool\":\"invoices\",\"operation\":\"read\",\"resource\":\"invoice/42\",\"request_id\":\"$key\"}" \
              http://127.0.0.1:8787/_local/idempotent-decisions > /tmp/quota-new.json
          done
          status=$(curl --silent -o /tmp/quota-overflow.json -w '%{http_code}' \
            -D /tmp/quota-overflow.headers \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            -H 'Content-Type: application/json' \
            -d '{"tool":"invoices","operation":"read","resource":"invoice/42","request_id":"ci-quota-decision-overflow"}' \
            http://127.0.0.1:8787/_local/idempotent-decisions)
          test "$status" = 429
          grep -qi '^retry-after: 60' /tmp/quota-overflow.headers
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $(cat .local-jwt/valid.txt)" \
            -H 'Content-Type: application/json' \
            -d '{"tool":"invoices","operation":"read","resource":"invoice/42","request_id":"decision-ci-retry-00001"}' \
            http://127.0.0.1:8787/_local/idempotent-decisions > /tmp/quota-exempt-replay.json
          python - <<'PY_QUOTA'
          import json
          from pathlib import Path
          first=json.loads(Path("/tmp/idempotent-first.json").read_text())
          retry=json.loads(Path("/tmp/quota-exempt-replay.json").read_text())
          assert first["event_id"] == retry["event_id"]
          assert retry["replayed"] is True and retry["audit_recorded"]
          assert retry["execution_authorized"] is False
          PY_QUOTA
          echo 'Local Pyodide/D1 tenant quota cap, 429, Retry-After and zero-cost exact replay verified.'


          echo 'Workers AI candidate validated ONLY with fake binding and atomic local D1 quota; no live inference.'

      - name: Preserve safe observed local Pyodide version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-worker-runtime-provenance
          path: /tmp/agentshield-worker-platform.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print diagnostic on failure
        if: failure()
        run: |
          if [ -f /tmp/agentshield-pywrangler.log ]; then
            sed -E 's/([Tt]oken|[Ss]ecret|[Pp]assword)=\S+/\1=[REDACTED]/g' /tmp/agentshield-pywrangler.log | tail -100
          fi
