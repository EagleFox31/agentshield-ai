name: Offline triage benchmark
on:
  pull_request:
    paths:
      - "src/agentshield/detection.py"
      - "src/agentshield/policy.py"
      - "scripts/triage_benchmark.py"
      - "tests/test_triage_benchmark.py"
      - "tests/fixtures/triage_benchmark/**"
      - ".github/workflows/offline-triage-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Security and schema tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_triage_benchmark.py -v
      - name: Frozen heldout synthetic benchmark
        run: PYTHONPATH=src python scripts/triage_benchmark.py --split heldout --output benchmark-result.json
      - name: Save non-sensitive metrics
        uses: actions/upload-artifact@v4
        with:
          name: offline-triage-benchmark
          path: benchmark-result.json
          retention-days: 14
